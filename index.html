function fuse(id){if(screen!=='workshop')return;let q=RECIPES.find(x=>x.id===id);if(!q||!q.parents.every(p=>S.relics.some(x=>x.id===p)))return;let growth=id==='furnace'?(S.relics.find(x=>x.id==='reactor').v||0):0;S.relics=S.relics.filter(x=>!q.parents.includes(x.id));addRelic(id);S.relics[S.relics.length-1].v=growth;if(!M.recipes.includes(id)&&S.mode!=='practice')M.recipes.push(id);closeModal();toast('TRANSFORMED: '+q.name);feat('fusions');openWorkshop(S.editorReturn)}
function tokenUI(){if(!S.slotTokens)return;modal(`<h2>FREE SLOT UPGRADE</h2><p>Spend one token for +0.5 base multiplier at a landing slot.</p><div class="buttons">${S.upgrades.map((v,i)=>`<button ${v>=6?'disabled':''} onclick="useSlotToken(${i})">${i===3?'GRAVE':'SLOT '+(i+1)} · LV${v}</button>`).join('')}</div><button onclick="closeModal()">CANCEL</button>`)}
function useSlotToken(i){if(!S.slotTokens||S.upgrades[i]>=6)return;S.slotTokens--;S.upgrades[i]++;feat('upgrades');closeModal();save();toast('Slot upgraded.');if(screen==='shop')shop();else if(screen==='workshop')openWorkshop(S.editorReturn)}
let armedTool=null;
const oldPlayUI=playUI;
playUI=function(){oldPlayUI();let main=$('#app main'),bar=document.createElement('div');bar.id='descentHud';main.insertBefore(bar,$('#board'));updateDescentHUD()};
function updateDescentHUD(){let el=$('#descentHud');if(!el||screen!=='play')return;let q=CONTRACTS.find(x=>x[0]===S.contract);el.innerHTML=`<p class="tiny muted">${actName()} · ${S.route?NODES[S.route][1]:'First Table'} · ${S.editCharges} edit charges ${S.boss===8?'· OPEN: '+((B?B.gate:(S.roundDrops||0)%2)===0?'1, 3, 5, 7':'2, 4, 6'):''}</p>${q?`<div class="contract tiny">${q[1]}: ${q[2]} <span class="money">${contractStatus()}</span></div>`:''}<div class="toolrow">${S.tools.map((id,i)=>`<button class="${armedTool===i?'armed':''}" onclick="armTool(${i})" title="${TOOLS[id][2]}" ${!B||paused?'disabled':''}>${TOOLS[id][0]} ${TOOLS[id][1]} [${i+1===1?'Q':'E'}]</button>`).join('')}${!S.tools.length?'<span class="tiny muted">UTILITY SLOTS EMPTY</span>':''}${armedTool!==null?'<button onclick="armedTool=null;updateDescentHUD()">CANCEL TOOL</button>':''}</div>`}
function contractStatus(){let c=S.ct||{};switch(S.contract){case'clean':return c.nudges?'MISSED':'NO NUDGES USED';case'grave':return(c.graves||0)+' GRAVES';case'one':return S.roundDrops>1?'MISSED':'FIRST BALL';case'tour':return(c.slots||[]).length+'/3 SLOTS';case'call':return(c.calls||0)+' CALLS HIT';case'bare':return(c.emptyMin??0)+' EMPTY SLOTS';default:return''}}
function consumeTool(i){let id=S.tools[i];S.tools.splice(i,1);armedTool=null;feat('tools');sound(750);updateDescentHUD();return id}
function armTool(i){if(!B||paused||!S.tools[i])return;let id=S.tools[i];if(id==='recall'){consumeTool(i);B.x=aim;B.y=24;B.vx=0;B.vy=0;B.t=Math.max(0,B.t-5);toast('RECALLED — score and peg hits preserved.');return}if(id==='bounce'){consumeTool(i);B.vy=-390;B.y=Math.min(B.y,495);particles(B.x,B.y,'#72e5ab',16);return}armedTool=armedTool===i?null:i;toast(TOOLS[id][2]);updateDescentHUD()}
function toolClick(p){if(!B||armedTool===null)return false;let i=armedTool,id=S.tools[i];if(id==='polarity'){consumeTool(i);B.vx+=(p.x<200?-1:1)*280;B.vy=Math.min(B.vy,120);return true}if(id==='wild'){if(p.y<490){toast('Tap a landing slot at the bottom.');return true}let slot=clamp(Math.floor(p.x/(W/7)),0,6);consumeTool(i);B.call=slot;return true}if(id==='detonate'){let q=P.filter(x=>x.t===4&&!x.hit&&!x.gone).sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y))[0];if(!q||Math.hypot(q.x-p.x,q.y-p.y)>26){toast('Tap an unhit orange bomb.');return true}consumeTool(i);hit(q);return true}return false}
const oldBind=bindCanvas;
bindCanvas=function(){oldBind();let down=canvas.onpointerdown;canvas.onpointerdown=e=>{let p=pointerPos(e);if(!paused&&B&&armedTool!==null){toolClick(p);return}down(e)}};
const priorKey=window.onkeydown;
window.onkeydown=e=>{if(screen==='play'&&!paused&&B&&['q','Q','e','E'].includes(e.key)){e.preventDefault();armTool(e.key.toLowerCase()==='q'?0:1);return}priorKey(e)};
const oldDrop=drop;
drop=function(){let before=B;oldDrop();if(!before&&B){descentState();B.gate=(S.roundDrops-1)%2;B.pulseCharge=0;B.contrib={};B.retriggerCount=0;B.reinforcedHits=0;B.linkedHits=0;S.rail=0;armedTool=null;if(S.boss===10)aim=W-aim;updateDescentHUD()}};
const oldNudge=nudge;
nudge=function(dir){let n=B?.nudges;oldNudge(dir);if(B&&B.nudges!==n){S.ct.nudges=(S.ct.nudges||0)+1;if(has('thunder')){B.mult+=2;B.pulseCharge=(B.pulseCharge||0)+1}updateDescentHUD()}};
const oldTrigger=trigger;
trigger=function(p){let b=B;if(!b)return;let prev=b.hits;oldTrigger(p);if(has('furnace')&&p.t===4){b.mult++;S.gold++;gainRelic('furnace',.04)}if(has('thunder')&&p.t===5)b.mult+=2;if(has('mint')&&p.t===3)b.mult+=2;if(has('observatory')&&b.colours===15&&!b.astro){b.astro=true;b.mult+=8}b.contrib=b.contrib||{};let k=['White chips','Blue chips','Red mult','Gold income','Bomb triggers','Spring hits'][p.t];b.contrib[k]=(b.contrib[k]||0)+1;
let ids=p.t===4?['reactor','detonator','furnace']:p.t===5?['wizard','vine','thunder']:p.t===2?['ruby','rain']:p.t===3?['midas','rush','mint']:p.t===1?['sapphire']:['heavy'];ids.forEach(id=>{if(has(id))pulseRelic(id)});if(has('snow'))pulseRelic('snow')};
let pulseUntil={};function pulseRelic(id){pulseUntil[id]=performance.now()+350}
const oldHit=hit;
hit=function(p){if(!B||p.t<0)return;let was=p.hit;p.hitCount=(p.hitCount||0)+1;p.lastContact=B.t;if(was)B.reinforcedHits=(B.reinforcedHits||0)+1;
if(has('furnace')&&p.t===4)for(let q of P)if(q.t===0&&!q.hit&&!q.gone&&Math.hypot(q.x-p.x,q.y-p.y)<stats().radius){q.t=3;q.glow=1}
oldHit(p);if(!B)return;if(p.bumper){B.vx+=p.bumper*105;float(p.x,p.y,'BUMPER','#68baff')}
if(p.link&&!p.linkFired){p.linkFired=true;let q=P.find(x=>x.key===p.link);if(q&&!q.hit&&!q.gone){B.linkedHits=(B.linkedHits||0)+1;hit(q)}}
if(has('thunder')&&p.t===5&&B.pulseCharge>0){let charges=B.pulseCharge;B.pulseCharge=0;let radius=40+Math.min(4,charges)*10;float(p.x,p.y,'THUNDER PULSE','#72e5ab');for(let q of P)if(q!==p&&q.t>=0&&!q.hit&&!q.gone&&Math.hypot(q.x-p.x,q.y-p.y)<radius)hit(q)} };
const originalPhysicalDrop=drop;
drop=function(){let active=B;originalPhysicalDrop();if(!active&&B)P.forEach(p=>p.linkFired=false)};
const oldLand=land;
land=function(){if(!B)return;let b=B,i=clamp(Math.floor(b.x/(W/7)),0,6);S.ct=S.ct||{};S.ct.slots=S.ct.slots||[];if(!S.ct.slots.includes(i))S.ct.slots.push(i);if(i===3)S.ct.graves=(S.ct.graves||0)+1;if(b.call===i)S.ct.calls=(S.ct.calls||0)+1;
if(has('haunted')){if(i===3){S.haunt=(S.haunt||0)+1;S.streak++;}else{S.gold+=(S.haunt||0)*2;S.haunt=0}}
if(has('railgun')&&b.call===i){b.mult+=8;S.rail=1}if(has('observatory')&&b.colours===15){float(b.x,395,'OBSERVATORY ×1.5','#68baff')}
let contrib={...(b.contrib||{})};if(b.reinforcedHits)contrib['Reinforced contacts']=b.reinforcedHits;if(b.linkedHits)contrib['Linked activations']=b.linkedHits;if(b.physicalHits&&b.hits>b.physicalHits)contrib['Extra scoring triggers']=b.hits-b.physicalHits;let streak=S.streak;armedTool=null;oldLand();if(has('haunted')&&i===3)S.streak=streak;S.lastContrib=Object.entries(contrib);S.lastBall.details=S.lastContrib;S.lastBall.contract=contractStatus();save();renderLast();updateDescentHUD()};
const oldRenderLast=renderLast;
renderLast=function(){oldRenderLast();let el=$('#lastBall');if(el&&S.lastBall){el.innerHTML+=`<div class="contrib">${(S.lastBall.details||[]).map(([k,n])=>k+': '+n).join('<br>')}</div><p class="tiny money">${S.lastBall.contract||''}</p>`}};
const oldDraw=draw;
draw=function(dt){oldDraw(dt);if(screen!=='play'||!ctx)return;let g=ctx;for(let p of P){if(p.t<0||p.gone)continue;if(p.reinforced){g.strokeStyle='#ffcf65';g.beginPath();g.arc(p.x,p.y,8,0,7);g.stroke()}if(p.link){let q=P.find(x=>x.key===p.link);if(q&&!q.gone){g.strokeStyle='#72e5ab33';g.beginPath();g.moveTo(p.x,p.y);g.lineTo(q.x,q.y);g.stroke()}}if(p.bumper){g.fillStyle='#fff';g.font='11px monospace';g.fillText(p.bumper<0?'‹':'›',p.x,p.y-8)}}if(S.boss===8){let gate=B?B.gate:(S.roundDrops||0)%2;for(let i=0;i<7;i++)if(i%2!==gate){g.fillStyle='#ff587666';g.fillRect(i*W/7+3,506,W/7-6,5)}}document.querySelectorAll('[data-relic]').forEach(el=>el.classList.toggle('pulse',!store.settings.reduced&&(pulseUntil[el.dataset.relic]||0)>performance.now()))};
const oldRenderOwned=renderOwned;
renderOwned=function(mode){oldRenderOwned(mode);let el=$('#relics');if(el)el.querySelectorAll('.owned').forEach((node,i)=>{let id=S.relics[i]?.id;node.dataset.relic=id;if(id===S.lockedRelic){node.style.opacity='.4';node.insertAdjacentHTML('beforeend','<span class="danger">DISABLED THIS ENCOUNTER</span>')}})};
// The original delay is retained for readability; fast scoring uses a short transition.
const oldAfter=afterBall;
afterBall=function(){if(screen==='play'&&paused){setTimeout(afterBall,200);return}oldAfter()};
function descentVictory(){screen='victory';S.phase='victory';root(`<div class="hero panel"><span class="tag">THE DESCENT IS COMPLETE</span><h1>REAPER<br><em>DOWN.</em></h1><h2>${fmt(S.score)} POINTS</h2><p>${orb()[2]} · Heat ${S.heat} · ${Object.keys(S.edits).length} board modifications · ${S.routeHistory.length} paths chosen</p><p class="good">${S.mode==='practice'?'Practice clear; progression disabled.':'Orb Heat progression recorded. You can safely finish now.'}</p><div class="buttons"><button class="gold" onclick="cashOut()">ESCAPE & BANK RUN</button><button onclick="routeUI()">ENTER THE BEYOND</button>${S.fusedFinal?'<button onclick="secretFinal()">CHALLENGE THE ARCHITECT</button>':''}</div><p class="tiny muted">${S.fusedFinal?'Your fusion unlocked an optional Architect challenge: +60% target on the next encounter.':'Create any fused relic before the final boss to unlock the optional Architect challenge.'} Endless is optional, not a requirement for a valid clear.</p></div>`);save()}
victory=descentVictory;
function secretFinal(){S.architect=true;S.reward='THE ARCHITECT — a single optional encounter. Target ×1.6. Clear it to claim a distinct ending.';S.route='elite';S.routeChosen=true;S.routeOptions=null;contractUI()}
const preArchitectTarget=target;
target=function(){return Math.round(preArchitectTarget()*(S.architect?1.6/1.35:1)/5)*5};
const preArchitectClear=clearRound;
clearRound=function(){let special=S.architect;if(special){S.architect=false;S.architectClear=true;S.rs=target();S.round++;S.gold+=15;S.reward='The Architect is defeated.';S.ended=true;S.phase='over';feat('architect');finishRecord();save();gameOver();return}preArchitectClear()};
const preFuse=fuse;
fuse=function(id){let count=S.relics.length;preFuse(id);if(S.relics.length<count){S.fusedFinal=true;save()}};
const oldResume=resume;
resume=function(){S=JSON.parse(JSON.stringify(store.run));descentState();if(S.phase==='falling'&&S.ballCheckpoint){S=S.ballCheckpoint;S.phase='play';delete S.ballCheckpoint;descentState()}B=null;armedTool=null;paused=false;switch(S.phase){case'route':routeUI();return;case'contract':contractUI();return;case'workshop':openWorkshop(S.editorReturn);return;case'event':eventUI();return;case'rest':restUI();return;case'jackpot':jackpotPicker();return;case'bosschoice':prepareBoss();return;default:store.run=JSON.parse(JSON.stringify(S));oldResume();descentState();updateDescentHUD()}};
const oldPause=pauseMenu;
pauseMenu=function(){oldPause();$('#modal>div').insertAdjacentHTML('beforeend',`<div class="sep"></div><div class="buttons"><button onclick="store.settings.fast=!store.settings.fast;persist();toast(store.settings.fast?'Fast scoring on':'Fast scoring off')">TOGGLE FAST SCORING</button><button onclick="store.settings.reduced=!store.settings.reduced;persist();toast(store.settings.reduced?'Reduced effects on':'Reduced effects off')">TOGGLE REDUCED EFFECTS</button></div>`)};
const oldHelp=help;
help=function(){oldHelp();$('#modal>div').insertAdjacentHTML('beforeend',`<div class="sep"></div><h3>THE DESCENT SYSTEMS</h3><p>After each encounter, choose a route. Markets offer shopping; workshops give two board edits. High-stakes tables trade a 35% harder target for visible rewards. Other paths offer contracts, tools, events or rest. Every route ends in a scoring encounter.</p><p>Paint, remove, reinforce, link or add a bumper at a workshop. One edit costs one charge. Your changes persist for the run. Rounds 5 and 9 introduce new layouts but preserve your modified positions.</p><p>Optional contracts cost nothing. Missed contracts have no penalty. Clearing the encounter is always required. A full utility rack converts awarded tools to $4.</p><p>Utility tools use Q/E or their buttons during flight. Some need a second tap on the board. Tools are consumed on use. Recall preserves earned score, spent nudges and hit pegs; it is not a free extra ball.</p><p>Relic fusion is available at workshops and market workbenches. It consumes both ingredients and frees one rack slot. Fusion cards explain which effects replace the originals.</p><p>Collector disables a chosen relic for one encounter. Gatekeeper alternates slot groups. The final Reaper offers a visible sacrifice. Create a fusion before winning to unlock the optional Architect ending.</p>`)};
const oldMenu=menu;
menu=function(){oldMenu();let p=$('.hero>p');if(p)p.textContent='Build the board. Choose the path. Break the machine.';let panel=document.createElement('div');panel.className='panel';panel.innerHTML='<h3>NEW: THE DESCENT</h3><p class="tiny muted">Branching paths · persistent board editing · optional contracts · six relic fusions · five utility tools · new bosses · optional Architect ending.</p><p class="tiny muted">Afterlife save format supported. Import your exported Afterlife backup if this file opens in a separate browser storage area.</p>';$('.hero').insertBefore(panel,$('.hero>.panel'));};
const oldRecord=finishRecord;
finishRecord=function(){if(S.recorded)return;oldRecord();if(S.mode!=='practice'&&M.records.length){M.records[0].ending=S.architectClear?'Architect':S.won?'Escape':'Fallen';M.records[0].edits=Object.keys(S.edits||{}).length;M.records[0].fusions=S.relics.filter(x=>RECIPES.some(q=>q.id===x.id)).length;persist()}};
const oldCollect=collection;
collection=function(){oldCollect();let top=document.createElement('div');top.className='panel';top.innerHTML=`<h3>TRANSFORMATIONS</h3><p class="tiny muted">${M.recipes.length}/${RECIPES.length} crafted · Ingredients and effects are revealed at workbenches. Practice does not discover recipes.</p><p>${M.recipes.map(id=>byId[id][2]).join(' · ')||'No fusions crafted yet.'}</p>`;$('#app').insertBefore(top,$('#app>.grid'))};
// Harden save import: reject unknown relics, invalid phases and oversized files.
importSave=async function(file){if(!file)return;try{if(file.size>2000000)throw Error();let data=JSON.parse(await file.text());if(!data.meta||!Array.isArray(data.meta.unlocks)||!Array.isArray(data.meta.relics))throw Error();if(data.run){let r=data.run;if(r.version!==1||!ORBS.some(x=>x[0]===r.orb)||!Array.isArray(r.relics)||r.relics.some(x=>!byId[x.id])||!Array.isArray(r.upgrades)||r.upgrades.length!==7||!Number.isFinite(r.seed)||!Number.isFinite(r.round)||r.round<1)throw Error()}window.imported=data;modal('<h2>Replace local progress?</h2><p>Afterlife and Descent backups are supported. Current local progress will be replaced.</p><div class="buttons"><button class="gold" onclick="store=imported;M=store.meta;persist();location.reload()">IMPORT</button><button onclick="closeModal()">CANCEL</button></div>')}catch{toast('Invalid or unsupported save file.')}};

const descentOver=gameOver;
gameOver=function(){descentOver();if(S.architectClear){let hero=$('.hero');let ending=document.createElement('div');ending.className='panel';ending.innerHTML='<span class="tag">SECRET ENDING</span><h2>THE ARCHITECT FALLS</h2><p>You did not merely escape the machine. You rewrote it.</p>';hero.insertBefore(ending,hero.children[0]);}};

menu();requestAnimationFrame(loop);
</script></body></html>
